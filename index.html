<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katholieke Gebeden — Nederlands, Engels, Portugees &amp; Latijn</title>
  <meta name="description" content="Een verzameling katholieke gebeden in het Nederlands, Engels, Portugees en Latijn, naast elkaar te lezen." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Als app te installeren (PWA): manifest, iconen en de kleur van de statusbalk -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#fbf7ef" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Gebeden" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">✚</span>
        <div class="brand-text">
          <h1 data-i18n="titel">Katholieke Gebeden</h1>
          <p data-i18n="ondertitel">Nederlands · Engels · Portugees · Latijn</p>
        </div>
      </div>

      <!-- Op smalle schermen klapt deze knop de hele balk hieronder in en uit. -->
      <button id="header-toggle" class="header-toggle" type="button" aria-expanded="false" aria-controls="header-panel">
        <span class="header-toggle-icon" aria-hidden="true">☰</span>
        <span class="header-toggle-chevron" aria-hidden="true">›</span>
      </button>

      <div id="header-panel" class="header-panel">
        <nav class="header-devotions" data-i18n-label="devoties">
          <button id="rosary-open" class="rosary-open-btn" type="button">
            <span aria-hidden="true">📿</span> <span data-i18n="rozenkrans">Rozenkrans bidden</span>
          </button>
          <button id="antiphon-open" class="rosary-open-btn" type="button">
            <span aria-hidden="true">🌸</span> <span data-i18n="antifoon">Maria-antifoon</span>
          </button>
          <button id="novena-open" class="rosary-open-btn" type="button">
            <span aria-hidden="true">🕯️</span> <span data-i18n="novena">Novena</span>
          </button>
          <button id="kruisweg-open" class="rosary-open-btn" type="button">
            <span aria-hidden="true">✝️</span> <span data-i18n="kruisweg">Kruisweg</span>
          </button>
        </nav>
        <div class="header-settings">
          <div id="lang-control" class="lang-slot"></div>
          <div class="fontsize-control" role="group" data-i18n-label="lettergrootte">
            <button id="font-smaller" class="fs-btn" type="button" data-i18n-label="kleiner">A−</button>
            <button id="font-larger" class="fs-btn" type="button" data-i18n-label="groter">A+</button>
          </div>
          <button id="theme-toggle" class="icon-btn" type="button" aria-pressed="false" aria-label="Donkere modus aan/uit" title="Donkere modus">
            <span class="theme-icon" aria-hidden="true">☾</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-expanded="false">
        <span class="sidebar-toggle-icon" aria-hidden="true">›</span>
        <span class="sidebar-toggle-label" id="sidebar-toggle-label">Gebeden</span>
      </button>
      <div class="search-wrap">
        <input
          type="search"
          id="search"
          class="search-input"
          placeholder="Zoek een gebed…"
          autocomplete="off"
          aria-label="Zoek een gebed"
        />
      </div>
      <nav id="prayer-list" class="prayer-list" aria-label="Lijst van gebeden"></nav>
    </aside>

    <section class="content">
      <article id="prayer-view" class="prayer-view" aria-live="polite"></article>
    </section>
  </main>

  <footer class="site-footer">
    <p><span data-i18n="voet">Gemaakt met eerbied · Nederlandse teksten o.a. van</span> <a href="https://rkliturgie.nl" target="_blank" rel="noopener">rkliturgie.nl</a></p>
    <p class="install" id="install" hidden>
      <button id="install-btn" class="install-btn" type="button">
        <span aria-hidden="true">📲</span> <span data-i18n="installeer">Als app installeren</span>
      </button>
    </p>
    <p class="install-help" id="install-help" hidden></p>
  </footer>

  <div id="rosary-root" class="rosary-root" hidden></div>
  <div id="antiphon-root" class="rosary-root" hidden></div>
  <div id="novena-root" class="rosary-root" hidden></div>
  <div id="kruisweg-root" class="rosary-root" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
